# Single (default) profile. Per-environment values are supplied as environment
# variables that override these keys — see dev/.env and prod/.env. cac reads
# them via viper (e.g. client.client_id <- CLIENT_CLIENT_ID,
# storage.dir_path <- STORAGE_DIR_PATH, logging.level <- LOGGING_LEVEL).
# The client secret comes from CLIENT_CLIENT_SECRET (CI: the CAC_CLIENT_SECRET
# secret); it is never committed here.
logging:
  level: info
  format: text
client:
  issuer_url: ""    # set per environment via CLIENT_ISSUER_URL
  client_id: ""     # set per environment via CLIENT_CLIENT_ID
  client_secret: "" # set via CLIENT_CLIENT_SECRET (never commit a real secret)
  tenant_id: ""     # set per environment via CLIENT_TENANT_ID
storage:
  dir_path: ""      # set per environment via STORAGE_DIR_PATH
