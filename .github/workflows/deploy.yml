name: Deploy Config

on:
  push:
    branches: [main]
    paths:
      - 'dev/workspaces/**'
      - 'prod/workspaces/**'
      - 'base/workspaces/**'
      - 'config.yaml'
      - 'vars.yaml'

permissions:
  contents: read

concurrency:
  group: cac-deploy
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect touched environments
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE..${{ github.sha }}" \
              | ./.github/scripts/detect-changes.sh >> "$GITHUB_OUTPUT"
          else
            # Force push or unreachable history: deploy everything.
            # Safe because `push --method patch` only applies repo-defined config.
            ./.github/scripts/detect-changes.sh --all >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    environment: ${{ matrix.env }}
    env:
      # cac reads only the var matching the active profile (viper AutomaticEnv);
      # the other one is ignored.
      CLIENT_CLIENT_SECRET: ${{ secrets.CAC_CLIENT_SECRET }}
      PROFILES_DEV_CLIENT_CLIENT_SECRET: ${{ secrets.CAC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Load environment variables
        # Templates use {{ env "TENANT_ID" }}; same vars the local flow
        # exports via `export $(xargs < <env>/.env)`.
        run: |
          { cat "${{ matrix.env }}/.env"; echo; } >> "$GITHUB_ENV"

      # Install the cac binary onto the runner (cached at /tmp/cac) so the
      # resolver below can probe the remote directly. --help is a no-op.
      - name: Install cac
        uses: SecureAuthCorp/ciam-config-as-code@v1.8.0
        with:
          args: --help

      # New workspace (absent on remote) -> import (create); existing -> patch (merge).
      - name: Resolve push method
        id: resolve
        run: ./.github/scripts/resolve-method.sh "${{ matrix.env }}" "${{ matrix.workspace }}"

      - name: Push configuration
        uses: SecureAuthCorp/ciam-config-as-code@v1.8.0
        with:
          args: >-
            push --config config.yaml
            --workspace ${{ matrix.workspace }}
            ${{ matrix.env == 'dev' && '--profile dev' || '' }}
            --method ${{ steps.resolve.outputs.method }}

      - name: Write summary
        env:
          METHOD: ${{ steps.resolve.outputs.method }}
          IS_NEW: ${{ steps.resolve.outputs.is_new }}
        run: |
          {
            echo "### CAC deploy: \`${{ matrix.workspace }}\` → \`${{ matrix.env }}\`"
            echo ""
            if [ "$IS_NEW" = "true" ]; then
              echo "- 🆕 New workspace — imported (created from repo config)"
            fi
            echo "- Method: \`${METHOD}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
